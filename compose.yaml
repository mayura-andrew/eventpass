services:
  eventpass:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      EVENTPASS_DEMO: "1"
      PORT: "8080"
      PUBLIC_URL: http://localhost:8080
      DATA_DIR: /data
    ports:
      - "8080:8080"
    volumes:
      - eventpass-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  eventpass-data:
