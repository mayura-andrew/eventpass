# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go lint, tests and OpenAPI drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14
          args: ./cmd/... ./internal/... ./web/...
      - name: OpenAPI drift (routes, permissions and response shapes)
        run: go test ./internal/api -run 'OpenAPI' -count=1
      - name: Unit, contract and API tests (incl. authorization matrix)
        run: go test -race -count=1 -coverpkg=./internal/... -coverprofile=coverage.out ./cmd/... ./internal/... ./web/...
      - name: Coverage (domain and storage)
        run: go tool cover -func=coverage.out | grep -E 'internal/(domain|storage)/|^total' | tail -20
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./cmd/... ./internal/... ./web/...

  web:
    name: Web lint, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Generated API client is current
        run: npm run gen:api && git diff --exit-code src/api/schema.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: npm audit
        run: npm audit --audit-level=high

  e2e:
    name: Playwright e2e and axe on the demo
    runs-on: ubuntu-latest
    needs: [go, web]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
