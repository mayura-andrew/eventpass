# DigitalOcean App Platform spec for the NSAC QR API + web apps.
#
# This file is the source of truth: .github/workflows/deploy.yml applies it
# on every push to main (digitalocean/app_action/deploy@v2), creating the app
# the first time and updating it after that. Settings changed in the control
# panel are overwritten by the next deploy, so change them here instead.
#
# Values written as '${NAME}' are filled in by the workflow from the GitHub
# repository secret of the same name (Settings > Secrets and variables >
# Actions). Never put a real secret in this file. ${APP_URL} is the exception:
# App Platform fills it in, and the action leaves it alone.
name: nsac-qr
# Bangalore. Pick the Supabase project in Mumbai (ap-south-1) to keep the
# database round trip short.
region: blr

services:
  - name: api
    github:
      repo: ai4all-learn/nsac-qr   # change to your repository
      branch: main
      # The GitHub Actions workflow deploys after the tests pass; letting App
      # Platform also build on push would deploy every commit twice.
      deploy_on_push: false
    dockerfile_path: Dockerfile
    source_dir: /
    http_port: 8080
    # Keep ONE instance: rate limits, the account cache and the live scan
    # feed live in the process's memory.
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /healthz
      initial_delay_seconds: 5
      period_seconds: 10
    routes:
      - path: /
    envs:
      # --- Required secrets (GitHub repository secrets) ---------------------
      # Supabase > Project Settings > Database > Connection string > Session
      # pooler (port 5432). Use the pooler, not the direct db.<ref>.supabase.co
      # host: that one is IPv6-only and App Platform connects over IPv4.
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
        value: '${DATABASE_URL}'
      # openssl rand -hex 32
      - key: JWT_SECRET
        scope: RUN_TIME
        type: SECRET
        value: '${JWT_SECRET}'
      # Signs delegate QR passes added from /admin/ingest.html. The SAME value
      # the seed script uses, kept for the whole event: changing it breaks
      # every pass already sent.
      - key: HMAC_SECRET_KEY
        scope: RUN_TIME
        type: SECRET
        value: '${HMAC_SECRET_KEY}'

      # --- Gmail SMTP --------------------------------------------------------
      - key: SMTP_HOST
        scope: RUN_TIME
        value: smtp.gmail.com
      - key: SMTP_PORT
        scope: RUN_TIME
        value: "587"
      - key: SMTP_SECURITY
        scope: RUN_TIME
        value: starttls
      # The full Gmail address that owns the app password.
      - key: SMTP_USERNAME
        scope: RUN_TIME
        type: SECRET
        value: '${SMTP_USERNAME}'
      # 16-character Google app password (spaces removed), NOT the account
      # password: Google Account > Security > 2-Step Verification > App passwords.
      - key: SMTP_PASSWORD
        scope: RUN_TIME
        type: SECRET
        value: '${SMTP_PASSWORD}'
      # Gmail sends as the signed-in account; use that same address here
      # (or a "Send mail as" alias already verified in Gmail).
      - key: SMTP_FROM
        scope: RUN_TIME
        type: SECRET
        value: '${SMTP_FROM}'

      # --- App ---------------------------------------------------------------
      # App Platform fills ${APP_URL} with the app's https:// address. Replace
      # with your own domain once one is attached.
      - key: APP_BASE_URL
        scope: RUN_TIME
        value: ${APP_URL}
      - key: EVENT_NAME
        scope: RUN_TIME
        value: NASA Space Apps Colombo
      # Pass email queue: one email every 2 s, at most 450 per 24 hours
      # (Gmail's ~500/day, shared with staff emails). On Google Workspace
      # (~2,000/day) raise the limit to about 1900.
      - key: EMAIL_SEND_INTERVAL
        scope: RUN_TIME
        value: 2s
      - key: EMAIL_DAILY_LIMIT
        scope: RUN_TIME
        value: "450"
      # App Platform's edge sets this to the real client IP; without it every
      # request looks like it comes from the load balancer and shares one
      # rate limit.
      - key: CLIENT_IP_HEADER
        scope: RUN_TIME
        value: DO-Connecting-IP
      - key: JWT_TTL
        scope: RUN_TIME
        value: 14h
      # Database connections this container may open. Keep it below the
      # Supabase project's pool size (Database Settings > Connection pooling
      # > Pool Size), leaving room for the seed script and the SQL editor.
      - key: DB_MAX_CONNS
        scope: RUN_TIME
        value: "10"
      - key: CHECKIN_SCENARIO_CODE
        scope: RUN_TIME
        value: CHECK_IN
      - key: PUBLIC_DIR
        scope: RUN_TIME
        value: /app/public
      # Optional: venue map on the pass page. Restrict the key to this app's
      # URL (HTTP referrers) in Google Cloud. Without the GitHub secret the
      # value is empty and the map is off.
      - key: GOOGLE_MAPS_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: '${GOOGLE_MAPS_API_KEY}'
      - key: GOOGLE_MAPS_MAP_ID
        scope: RUN_TIME
        value: ""
