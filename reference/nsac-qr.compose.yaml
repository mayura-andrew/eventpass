services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nsac_qr
      POSTGRES_USER: nsac
      POSTGRES_PASSWORD: nsac-local-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./migrations/002_dashboard_schema.sql:/docker-entrypoint-initdb.d/002_dashboard_schema.sql:ro
      - ./migrations/003_rbac_and_emailing.sql:/docker-entrypoint-initdb.d/003_rbac_and_emailing.sql:ro
      - ./migrations/004_auto_membership_id.sql:/docker-entrypoint-initdb.d/004_auto_membership_id.sql:ro
      - ./migrations/005_jsonb_dynamic_schema.sql:/docker-entrypoint-initdb.d/005_jsonb_dynamic_schema.sql:ro
      - ./migrations/006_email_queue_schema.sql:/docker-entrypoint-initdb.d/006_email_queue_schema.sql:ro
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nsac -d nsac_qr"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://nsac:nsac-local-password@db:5432/nsac_qr?sslmode=disable
      PORT: "8080"
      PUBLIC_DIR: /app/public
      # Local email always goes to Mailpit (http://localhost:8025). These are
      # fixed values, not ${...} defaults, on purpose: Compose would otherwise
      # pull SMTP_* from the developer's shell and send test mail for real.
      APP_BASE_URL: http://localhost:8080
      SMTP_HOST: mail
      SMTP_PORT: "1025"
      SMTP_SECURITY: none
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      SMTP_FROM: NASA Space Apps Colombo <no-reply@spaceapps.local>
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_started
    ports:
      - "8080:8080"

  # Catches every email the API sends; read them at http://localhost:8025.
  mail:
    image: axllent/mailpit:v1.21.8
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  postgres-data:
