# SPDX-License-Identifier: Apache-2.0
openapi: 3.1.0
info:
  title: EventPass API
  version: 0.1.0
  description: |
    JSON API for EventPass. Every mutating request must send the header
    `X-EventPass-CSRF: 1`. Errors always have the shape
    `{"error": {"code", "message", "details"}}`; codes are stable and the UI
    translates them. `x-permission` on each operation names the permission
    the server checks (see internal/domain/roles.go).
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: /api/v1

paths:
  /setup/status:
    get:
      operationId: getSetupStatus
      x-permission: public
      summary: Whether first-run setup is complete, and demo info
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupStatus" }

  /auth/magic-link:
    post:
      operationId: requestMagicLink
      x-permission: public
      summary: Email a sign-in link. Same response whether or not the address can sign in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, audience]
              properties:
                email: { type: string, format: email }
                audience: { type: string, enum: [staff, participant] }
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                required: [accepted, message]
                properties:
                  accepted: { type: boolean }
                  message: { type: string }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/Error" }

  /auth/callback:
    post:
      operationId: completeMagicLink
      x-permission: public
      summary: Exchange a sign-in token for a session cookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: Signed in; sets the session cookie
          content:
            application/json:
              schema:
                type: object
                required: [kind, redirect]
                properties:
                  kind: { type: string, enum: [user, participant] }
                  redirect: { type: string }
        "400": { $ref: "#/components/responses/Error" }

  /auth/logout:
    post:
      operationId: logout
      x-permission: public
      responses:
        "204": { description: Signed out }

  /auth/me:
    get:
      operationId: getMe
      x-permission: authenticated
      responses:
        "200":
          description: The signed-in principal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Error" }

  /public/events/{slug}:
    get:
      operationId: getPublicEvent
      x-permission: public
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: A published event
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicEvent" }
        "404": { $ref: "#/components/responses/Error" }

  /me/registrations:
    get:
      operationId: listMyRegistrations
      x-permission: participant
      responses:
        "200":
          description: The participant's registrations across events
          content:
            application/json:
              schema:
                type: object
                required: [registrations]
                properties:
                  registrations:
                    type: array
                    items: { $ref: "#/components/schemas/Registration" }

  /workspace/settings:
    get:
      operationId: getWorkspaceSettings
      x-permission: workspace.read
      responses:
        "200":
          description: Workspace settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceSettings" }
    patch:
      operationId: updateWorkspaceSettings
      x-permission: workspace.write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [settings]
              properties:
                settings:
                  type: object
                  additionalProperties: { type: string }
      responses:
        "200":
          description: Saved settings and warnings (e.g. primary_color_low_contrast)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceSettings" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /workspace/users:
    get:
      operationId: listUsers
      x-permission: users.read
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users: { type: array, items: { $ref: "#/components/schemas/User" } }
    post:
      operationId: createUser
      x-permission: users.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, workspaceRole]
              properties:
                email: { type: string, format: email }
                name: { type: string }
                workspaceRole: { $ref: "#/components/schemas/WorkspaceRole" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /workspace/users/{userID}:
    patch:
      operationId: updateUser
      x-permission: users.manage
      parameters:
        - { name: userID, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string }
                workspaceRole: { $ref: "#/components/schemas/WorkspaceRole" }
                status: { type: string, enum: [active, disabled] }
                signOutEverywhere: { type: boolean }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "409": { $ref: "#/components/responses/Error" }

  /workspace/audit:
    get:
      operationId: listAudit
      x-permission: audit.read
      parameters:
        - { name: eventId, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000 } }
      responses:
        "200":
          description: Newest first
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } }

  /system/health:
    get:
      operationId: getSystemHealth
      x-permission: system.health
      responses:
        "200":
          description: Server health
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemHealth" }

  /events:
    get:
      operationId: listEvents
      x-permission: event.list_own
      summary: Events the caller can open, with their role
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events: { type: array, items: { $ref: "#/components/schemas/Event" } }
    post:
      operationId: createEvent
      x-permission: event.create
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /events/{eventID}:
    parameters:
      - $ref: "#/components/parameters/EventID"
    get:
      operationId: getEvent
      x-permission: event.read
      responses:
        "200":
          description: The event with its settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
    patch:
      operationId: updateEvent
      x-permission: event.write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /events/{eventID}/roles:
    parameters:
      - $ref: "#/components/parameters/EventID"
    get:
      operationId: listEventRoles
      x-permission: event.roles_manage
      responses:
        "200":
          description: People with a role in this event
          content:
            application/json:
              schema:
                type: object
                required: [roles]
                properties:
                  roles: { type: array, items: { $ref: "#/components/schemas/EventRoleGrant" } }
    post:
      operationId: grantEventRole
      x-permission: event.roles_manage
      summary: Grant a role by email, creating the user if needed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, role]
              properties:
                email: { type: string, format: email }
                name: { type: string }
                role: { $ref: "#/components/schemas/EventRole" }
      responses:
        "200":
          description: Granted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventRoleGrant" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /events/{eventID}/roles/{userID}:
    parameters:
      - $ref: "#/components/parameters/EventID"
      - { name: userID, in: path, required: true, schema: { type: string } }
    delete:
      operationId: revokeEventRole
      x-permission: event.roles_manage
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/Error" }

  /events/{eventID}/fields:
    parameters:
      - $ref: "#/components/parameters/EventID"
    get:
      operationId: listFields
      x-permission: fields.read
      summary: Profile fields the caller's role may see
      responses:
        "200":
          description: Fields
          content:
            application/json:
              schema:
                type: object
                required: [fields]
                properties:
                  fields: { type: array, items: { $ref: "#/components/schemas/Field" } }

  /events/{eventID}/checkpoints:
    parameters:
      - $ref: "#/components/parameters/EventID"
    get:
      operationId: listCheckpoints
      x-permission: checkpoints.read
      responses:
        "200":
          description: Checkpoints
          content:
            application/json:
              schema:
                type: object
                required: [checkpoints]
                properties:
                  checkpoints: { type: array, items: { $ref: "#/components/schemas/Checkpoint" } }

  /events/{eventID}/participants:
    parameters:
      - $ref: "#/components/parameters/EventID"
    get:
      operationId: listParticipants
      x-permission: participant.list
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - name: status
          in: query
          description: Comma-separated statuses
          schema: { type: string }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        "200": { $ref: "#/components/responses/ParticipantList" }

  /events/{eventID}/participants/{participantID}:
    parameters:
      - $ref: "#/components/parameters/EventID"
      - { name: participantID, in: path, required: true, schema: { type: string } }
    get:
      operationId: getParticipant
      x-permission: participant.view
      responses:
        "200":
          description: The participant, with values the caller may see
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Participant" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateParticipant
      x-permission: participant.write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                status: { $ref: "#/components/schemas/ParticipantStatus" }
                notes: { type: string, maxLength: 5000 }
                values:
                  type: object
                  additionalProperties: { type: string }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Participant" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /events/{eventID}/lookup:
    parameters:
      - $ref: "#/components/parameters/EventID"
    get:
      operationId: lookupParticipants
      x-permission: participant.lookup
      summary: Scanner manual search by pass ID, name or email (max 20)
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2 } }
      responses:
        "200": { $ref: "#/components/responses/ParticipantList" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /events/{eventID}/stats:
    parameters:
      - $ref: "#/components/parameters/EventID"
    get:
      operationId: getEventStats
      x-permission: stats.read
      responses:
        "200":
          description: Live counts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventStats" }

  /events/{eventID}/activity:
    parameters:
      - $ref: "#/components/parameters/EventID"
    get:
      operationId: getEventActivity
      x-permission: stats.read
      responses:
        "200":
          description: Latest checkpoint records and admin actions, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Activity" } }

  /dev/mail:
    get:
      operationId: listDevMail
      x-permission: public
      summary: Demo mode only. Emails caught instead of sent. 404 otherwise.
      responses:
        "200":
          description: Newest first
          content:
            application/json:
              schema:
                type: object
                required: [messages]
                properties:
                  messages: { type: array, items: { $ref: "#/components/schemas/CaughtMail" } }
        "404": { $ref: "#/components/responses/Error" }

  /setup/google-check:
    post:
      operationId: setupGoogleCheck
      x-permission: public
      summary: Wizard step. Checks the service account can open the system spreadsheet. Needs X-Setup-Token.
      parameters:
        - $ref: "#/components/parameters/SetupToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GoogleInput" }
      responses:
        "200":
          description: Access works
          content:
            application/json:
              schema:
                type: object
                required: [serviceAccountEmail, spreadsheetTitle, spreadsheetId]
                properties:
                  serviceAccountEmail: { type: string }
                  spreadsheetTitle: { type: string }
                  spreadsheetId: { type: string }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /setup/smtp-check:
    post:
      operationId: setupSmtpCheck
      x-permission: public
      summary: Wizard step. Logs in to SMTP and sends a test email. Needs X-Setup-Token.
      parameters:
        - $ref: "#/components/parameters/SetupToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SMTPInput" }
      responses:
        "200":
          description: Test email sent
          content:
            application/json:
              schema:
                type: object
                required: [sent]
                properties:
                  sent: { type: boolean }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /setup/complete:
    post:
      operationId: setupComplete
      x-permission: public
      summary: Wizard finish. Saves secrets, creates tabs and the owner, emails the owner a sign-in link.
      parameters:
        - $ref: "#/components/parameters/SetupToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [google, smtp, productName, ownerEmail]
              properties:
                google: { $ref: "#/components/schemas/GoogleInput" }
                smtp: { $ref: "#/components/schemas/SMTPInput" }
                productName: { type: string }
                timeZone: { type: string }
                primaryColor: { type: string }
                ownerEmail: { type: string, format: email }
                ownerName: { type: string }
      responses:
        "200":
          description: Setup complete
          content:
            application/json:
              schema:
                type: object
                required: [complete, ownerEmail]
                properties:
                  complete: { type: boolean }
                  ownerEmail: { type: string }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /public/events/{slug}/register:
    post:
      operationId: register
      x-permission: public
      summary: Register for a published event. A known email gets "already_registered" and a portal link by email.
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [values]
              properties:
                values: { type: object, additionalProperties: { type: string } }
                consent: { type: boolean }
                locale: { type: string }
      responses:
        "201":
          description: Registered; status is registered, pending_approval or waitlisted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegisterResult" }
        "200":
          description: Already registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegisterResult" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/Error" }

  /me/events/{eventID}/pass:
    parameters:
      - $ref: "#/components/parameters/EventID"
    get:
      operationId: getMyPass
      x-permission: participant
      responses:
        "200":
          description: The participant's pass; token is the QR content
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pass" }
        "404": { $ref: "#/components/responses/Error" }

  /me/events/{eventID}/pass.png:
    parameters:
      - $ref: "#/components/parameters/EventID"
      - { name: download, in: query, schema: { type: string, enum: ["1"] } }
    get:
      operationId: getMyPassPng
      x-permission: participant
      responses:
        "200":
          description: Pass card image
          content:
            image/png:
              schema: { type: string, format: binary }

  /me/events/{eventID}/pass.pdf:
    parameters:
      - $ref: "#/components/parameters/EventID"
      - { name: download, in: query, schema: { type: string, enum: ["1"] } }
    get:
      operationId: getMyPassPdf
      x-permission: participant
      responses:
        "200":
          description: Printable A6 pass
          content:
            application/pdf:
              schema: { type: string, format: binary }

  /events/{eventID}/connect-sheet:
    parameters:
      - $ref: "#/components/parameters/EventID"
    post:
      operationId: connectSheet
      x-permission: event.write
      summary: Attach an empty spreadsheet (shared with the service account) to the event and create its tabs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [spreadsheet]
              properties:
                spreadsheet: { type: string, description: Link or ID }
      responses:
        "200":
          description: Connected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /events/{eventID}/fields/{key}:
    parameters:
      - $ref: "#/components/parameters/EventID"
      - { name: key, in: path, required: true, schema: { type: string } }
    put:
      operationId: putField
      x-permission: fields.write
      summary: Create or update a field. The key is the column header and never changes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FieldInput" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Field" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      operationId: hideField
      x-permission: fields.write
      summary: Hide a field; its column and data stay in the sheet
      responses:
        "204": { description: Hidden }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /events/{eventID}/fields/order:
    parameters:
      - $ref: "#/components/parameters/EventID"
    post:
      operationId: orderFields
      x-permission: fields.write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [keys]
              properties:
                keys: { type: array, items: { type: string } }
      responses:
        "200":
          description: Fields in their new order
          content:
            application/json:
              schema:
                type: object
                required: [fields]
                properties:
                  fields: { type: array, items: { $ref: "#/components/schemas/Field" } }

  /events/{eventID}/participants/{participantID}/resend-pass:
    parameters:
      - $ref: "#/components/parameters/EventID"
      - { name: participantID, in: path, required: true, schema: { type: string } }
    post:
      operationId: resendPass
      x-permission: participant.write
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema:
                type: object
                required: [queued]
                properties:
                  queued: { type: boolean }
        "409": { $ref: "#/components/responses/Error" }

  /events/{eventID}/export.csv:
    parameters:
      - $ref: "#/components/parameters/EventID"
    get:
      operationId: exportParticipants
      x-permission: participant.list
      responses:
        "200":
          description: CSV of participants (formula-safe), with the fields the caller may see
          content:
            text/csv:
              schema: { type: string }

  /events/{eventID}/outbox:
    parameters:
      - $ref: "#/components/parameters/EventID"
    get:
      operationId: listOutbox
      x-permission: comms.manage
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [queued, sending, sent, failed, cancelled] }
        - { name: participantId, in: query, schema: { type: string } }
      responses:
        "200":
          description: Newest first, at most 200
          content:
            application/json:
              schema:
                type: object
                required: [emails]
                properties:
                  emails: { type: array, items: { $ref: "#/components/schemas/OutboxEmail" } }

  /events/{eventID}/outbox/{emailID}/retry:
    parameters:
      - $ref: "#/components/parameters/EventID"
      - { name: emailID, in: path, required: true, schema: { type: string } }
    post:
      operationId: retryEmail
      x-permission: comms.manage
      responses:
        "200":
          description: Queued again
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OutboxEmail" }
        "409": { $ref: "#/components/responses/Error" }

components:
  parameters:
    SetupToken:
      name: X-Setup-Token
      in: header
      required: true
      description: One-time token printed in the server log at first start
      schema: { type: string }
    EventID:
      name: eventID
      in: path
      required: true
      schema: { type: string }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    ValidationFailed:
      description: "Validation failed; details.fields maps field key to {code, message}"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    ParticipantList:
      description: Participants
      content:
        application/json:
          schema:
            type: object
            required: [participants, total]
            properties:
              participants: { type: array, items: { $ref: "#/components/schemas/Participant" } }
              total: { type: integer }

  schemas:
    GoogleInput:
      type: object
      additionalProperties: false
      properties:
        credentialsJson: { type: string, description: Pasted service account key; empty when GOOGLE_APPLICATION_CREDENTIALS is set }
        spreadsheet: { type: string, description: Link or ID }

    SMTPInput:
      type: object
      additionalProperties: false
      properties:
        host: { type: string }
        port: { type: integer }
        username: { type: string }
        password: { type: string }
        from: { type: string }
        testTo: { type: string }

    SetupState:
      type: object
      required: [complete, googleConfigured, sheetConfigured, smtpConfigured]
      properties:
        complete: { type: boolean }
        googleConfigured: { type: boolean }
        serviceAccountEmail: { type: string }
        sheetConfigured: { type: boolean }
        smtpConfigured: { type: boolean }

    RegisterResult:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [registered, pending_approval, waitlisted, already_registered] }

    PublicEvent:
      allOf:
        - $ref: "#/components/schemas/Event"
        - type: object
          required: [registration, spotsLeft, fields]
          properties:
            registration: { type: string, enum: [open, not_published, not_yet_open, closed] }
            spotsLeft: { type: integer, description: "-1 when unlimited" }
            fields: { type: array, items: { $ref: "#/components/schemas/Field" } }
            consentText: { type: string }
            consentVersion: { type: string }

    Pass:
      type: object
      required: [token, passId, status, active, fullName, eventName]
      properties:
        token: { type: string }
        passId: { type: string }
        status: { $ref: "#/components/schemas/ParticipantStatus" }
        active: { type: boolean }
        fullName: { type: string }
        eventName: { type: string }
        when: { type: string }
        venue: { type: string }
        statusLabel: { type: string }

    Validation:
      type: object
      additionalProperties: false
      properties:
        minLength: { type: integer }
        maxLength: { type: integer }
        min: { type: number }
        max: { type: number }
        pattern: { type: string }
        patternMessage: { type: string }
        maxFileMB: { type: integer }
    FieldInput:
      type: object
      additionalProperties: false
      required: [type, label, visibility, editable]
      properties:
        type: { type: string }
        label: { type: string }
        helpText: { type: string }
        placeholder: { type: string }
        required: { type: boolean }
        options: { type: array, items: { type: string } }
        validation: { $ref: '#/components/schemas/Validation' }
        editable: { type: string, enum: ["no", until, until_checkin, always] }
        editableUntil: { type: string, format: date-time }
        visibility: { type: string, enum: [public, participant, staff, admin] }
        condition:
          type: object
          required: [field]
          properties:
            field: { type: string }
            equals: { type: string }
        order: { type: integer }
        translations: { type: object }

    OutboxEmail:
      type: object
      required: [id, participantId, to, template, status, attempts]
      properties:
        id: { type: string }
        createdAt: { type: string, format: date-time }
        participantId: { type: string }
        to: { type: string }
        template: { type: string }
        status: { type: string, enum: [queued, sending, sent, failed, cancelled] }
        attempts: { type: integer }
        nextAttemptAt: { type: string, format: date-time }
        lastError: { type: string }
        sentAt: { type: string, format: date-time }

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object, additionalProperties: true }

    WorkspaceRole: { type: string, enum: [owner, admin, none] }
    EventRole: { type: string, enum: [admin, staff, viewer] }
    EventStatus: { type: string, enum: [draft, published, registration_closed, finished, archived] }
    ParticipantStatus:
      type: string
      enum: [pending_approval, waitlisted, registered, confirmed, checked_in, cancelled, rejected]

    SetupStatus:
      type: object
      required: [complete, demo, productName]
      properties:
        complete: { type: boolean }
        demo: { type: boolean }
        productName: { type: string }
        primaryColor: { type: string }
        accentColor: { type: string }
        setup: { $ref: "#/components/schemas/SetupState" }
        demoLogins:
          type: object
          description: Demo mode only; role name to email
          additionalProperties: { type: string }

    Me:
      type: object
      required: [kind, email]
      properties:
        kind: { type: string, enum: [user, participant] }
        email: { type: string }
        user: { $ref: "#/components/schemas/User" }
        workspacePermissions: { type: array, items: { type: string } }
        events:
          type: array
          items:
            type: object
            required: [id, slug, name, role]
            properties:
              id: { type: string }
              slug: { type: string }
              name: { type: string }
              role: { $ref: "#/components/schemas/EventRole" }

    User:
      type: object
      required: [id, email, name, workspaceRole, status]
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
        workspaceRole: { $ref: "#/components/schemas/WorkspaceRole" }
        status: { type: string, enum: [active, disabled] }
        createdAt: { type: string, format: date-time }
        lastLoginAt: { type: string, format: date-time }

    WorkspaceSettings:
      type: object
      required: [settings, warnings]
      properties:
        settings: { type: object, additionalProperties: { type: string } }
        warnings: { type: array, items: { type: string } }

    AuditEntry:
      type: object
      required: [time, action]
      properties:
        time: { type: string, format: date-time }
        actorUserId: { type: string }
        actorEmail: { type: string }
        action: { type: string }
        eventId: { type: string }
        targetId: { type: string }
        details: { type: string }

    SystemHealth:
      type: object
      required: [status, version, storage, demo, uptimeSeconds, goVersion]
      properties:
        status: { type: string }
        version: { type: string }
        storage: { type: string }
        demo: { type: boolean }
        uptimeSeconds: { type: integer }
        goVersion: { type: string }

    Event:
      type: object
      required: [id, slug, name, status, timeZone]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        status: { $ref: "#/components/schemas/EventStatus" }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        timeZone: { type: string }
        createdAt: { type: string, format: date-time }
        role: { $ref: "#/components/schemas/EventRole" }
        settings: { type: object, additionalProperties: { type: string } }
        sheetConnected: { type: boolean }
        spreadsheetId: { type: string }
        serviceAccountEmail:
          type: string
          description: Admins only, while no spreadsheet is connected; share the event's spreadsheet with this address
    EventInput:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 120 }
        slug: { type: string, pattern: "^[a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?$" }
        status: { $ref: "#/components/schemas/EventStatus" }
        timeZone: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        settings: { type: object, additionalProperties: { type: string } }

    EventRoleGrant:
      type: object
      required: [user, role]
      properties:
        user: { $ref: "#/components/schemas/User" }
        role: { $ref: "#/components/schemas/EventRole" }
        grantedAt: { type: string, format: date-time }

    Field:
      type: object
      required: [key, type, label, required, validation, editable, visibility, order, hidden, builtin]
      properties:
        key: { type: string }
        type:
          type: string
          enum: [short_text, long_text, email, phone, number, date, single_select, multi_select,
                 checkbox, consent, url, photo, file, section]
        label: { type: string }
        helpText: { type: string }
        placeholder: { type: string }
        required: { type: boolean }
        options: { type: array, items: { type: string } }
        validation: { $ref: '#/components/schemas/Validation' }
        editable: { type: string, enum: ["no", until, until_checkin, always] }
        editableUntil: { type: string, format: date-time }
        visibility: { type: string, enum: [public, participant, staff, admin] }
        condition:
          type: object
          required: [field]
          properties:
            field: { type: string }
            equals: { type: string }
        order: { type: integer }
        hidden: { type: boolean }
        builtin: { type: boolean }

    Checkpoint:
      type: object
      required: [id, name, kind, requires, repeatable, minGapMinutes, allowedRoles, order, active]
      properties:
        id: { type: string }
        name: { type: string }
        icon: { type: string }
        kind: { type: string, enum: [status_change, attendance] }
        setsStatus: { $ref: "#/components/schemas/ParticipantStatus" }
        requires: { type: array, items: { type: string } }
        repeatable: { type: boolean }
        minGapMinutes: { type: integer }
        opensAt: { type: string, format: date-time }
        closesAt: { type: string, format: date-time }
        allowedRoles: { type: array, items: { $ref: "#/components/schemas/EventRole" } }
        order: { type: integer }
        active: { type: boolean }

    Participant:
      type: object
      required: [id, passId, email, fullName, status, source, values]
      properties:
        id: { type: string }
        passId: { type: string }
        email: { type: string }
        fullName: { type: string }
        status: { $ref: "#/components/schemas/ParticipantStatus" }
        source: { type: string, enum: [web, form, csv, admin] }
        registeredAt: { type: string, format: date-time }
        checkedInAt: { type: string, format: date-time }
        notes: { type: string }
        values:
          type: object
          description: Custom field values the caller may see, keyed by field key
          additionalProperties: { type: string }

    Registration:
      type: object
      required: [event, participant]
      properties:
        event: { $ref: "#/components/schemas/Event" }
        participant: { $ref: "#/components/schemas/Participant" }

    CheckpointStat:
      type: object
      required: [id, name, done]
      properties:
        id: { type: string }
        name: { type: string }
        done: { type: integer }

    EventStats:
      type: object
      required: [total, byStatus, checkpoints]
      properties:
        total: { type: integer }
        byStatus:
          type: object
          additionalProperties: { type: integer }
        checkpoints: { type: array, items: { $ref: "#/components/schemas/CheckpointStat" } }

    Activity:
      type: object
      required: [time, kind, action]
      properties:
        time: { type: string, format: date-time }
        kind: { type: string, enum: [checkpoint, audit] }
        actor: { type: string }
        action: { type: string }
        participantId: { type: string }
        checkpointId: { type: string }
        result: { type: string, enum: [recorded, duplicate, rejected] }
        undone: { type: boolean }

    CaughtMail:
      type: object
      required: [id, time, to, subject, text, html]
      properties:
        id: { type: string }
        time: { type: string, format: date-time }
        to: { type: string }
        subject: { type: string }
        text: { type: string }
        html: { type: string }
        attachments:
          type: array
          items:
            type: object
            required: [filename, contentType]
            properties:
              filename: { type: string }
              contentType: { type: string }
              inline: { type: boolean }
              contentId: { type: string }
